spring:
  application:
    name: PCM
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:sqlite:pcm.db
    driver-class-name: org.sqlite.JDBC
    username: pcm
    password: pcm
pcm:
  jwt:
    secret: ${JWT_SECRET:pcm-local-development-jwt-secret-key-change-me}
    expiration: 1h
